name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version is hardcoded here.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Lint
        # Hard gate: any non-cosmetic `warn` line fails CI.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^[[:space:]]*warn ' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then echo "lint: warnings in $f"; fail=1; fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/avatara
          echo "avatara: $(wc -c < build/avatara) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/avatara | grep -q "7f45 4c46"

      - name: Build examples
        run: |
          CYRIUS_DCE=1 cyrius build programs/traditions.cyr build/traditions
          CYRIUS_DCE=1 cyrius build programs/compose.cyr build/compose

      - name: Unit tests
        run: |
          cyrius test tests/avatara.tcyr tests/json.tcyr 2>&1 | tee /tmp/test_output
          tail -1 /tmp/test_output | grep "0 failed"

      - name: Benchmarks
        # Run the suite to catch performance regressions / build breakage.
        run: |
          CYRIUS_DCE=1 cyrius build tests/avatara.bcyr build/bench
          ./build/bench

      - name: Verify dist bundles are current
        # dist/avatara.cyr and dist/avatara-json.cyr are committed for consumers;
        # ensure both (and their .deps sidecars) match source. --no-default-features
        # keeps the optional bayan dep out of distlib's compile-verify: with bayan's
        # leaves already in scope the verify under-reports both sidecars (ADR-011).
        run: |
          cyrius distlib --all --no-default-features 2>&1 | tee /tmp/distlib_output
          git diff --exit-code dist/ || { echo "dist/ is stale — run 'cyrius distlib --all --no-default-features' and commit"; exit 1; }
          # The JSON bundle may leave only bayan's names for the consumer to supply. Any other
          # undefined name means [lib.json] has fallen out of step with [lib].
          other=$(grep -E '^[[:space:]]+[A-Za-z_][A-Za-z0-9_]* \(' /tmp/distlib_output | grep -vE '^[[:space:]]+bayan_' || true)
          if [ -n "$other" ]; then echo "distlib: undefined names besides bayan's:"; echo "$other"; exit 1; fi
          if grep -q 'bayan_' dist/avatara.cyr; then echo "dist/avatara.cyr calls bayan — JSON belongs in dist/avatara-json.cyr only"; exit 1; fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives from the VERSION file.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then CYML_VERSION="$FILE_VERSION"; else CYML_VERSION="$CYML_RAW"; fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
      - name: Verify toolchain pin consistency
        run: |
          # The cyrius.cyml `[package].cyrius` pin is the single source of truth;
          # the human-facing docs quote it by hand and must not drift.
          PIN=$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')
          grep -q "^- \*\*Compiler\*\*: cyrius >= ${PIN} " CLAUDE.md || { echo "CLAUDE.md compiler pin != cyrius.cyml ($PIN) — run scripts/version-bump.sh"; exit 1; }
          HITS=$(grep -c "Cyrius compiler ${PIN}+" README.md || true)
          [ "$HITS" = "2" ] || { echo "README.md: expected 2 'Cyrius compiler ${PIN}+' references, found $HITS — run scripts/version-bump.sh"; exit 1; }
          echo "Toolchain pin consistent: $PIN"
